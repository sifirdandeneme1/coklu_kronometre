<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kronometre</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0f1115; color: #f3f4f6; min-height: 100vh; padding: 20px 15px; }
        
        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 1.4rem; color: #e2e8f0; font-weight: 700; margin-bottom: 15px; letter-spacing: 1px; }
        
        .add-btn {
            background: #2563eb; color: white; border: none; padding: 14px 20px; border-radius: 12px;
            font-size: 1rem; font-weight: 600; width: 100%; cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); transition: transform 0.1s;
        }
        .add-btn:active { transform: scale(0.97); }

        .tabs {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px 18px; 
            border-radius: 20px; font-size: 0.9rem; white-space: nowrap; cursor: pointer; transition: all 0.2s;
        }
        .tab.active { background: #e2e8f0; color: #0f1115; font-weight: bold; border-color: #e2e8f0; }

        .empty-state { text-align: center; padding: 40px 20px; color: #64748b; font-size: 1rem; line-height: 1.5; }

        .timer-hardware {
            background: #1e1e1e; border: 12px solid #0a0a0a; border-radius: 24px;
            padding: 20px 15px; margin-bottom: 25px; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.6);
        }
        
        .timer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px; }
        .timer-title { font-size: 1.1rem; font-weight: 600; color: #d1d5db; letter-spacing: 0.5px; }
        .delete-btn { 
            background: #ef4444; color: white; border: none; width: 26px; height: 26px; 
            border-radius: 50%; font-size: 0.9rem; cursor: pointer; line-height: 1; 
            display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .lcd-screen {
            background: #a8b29e;
            border-radius: 8px; padding: 25px 10px; margin-bottom: 20px;
            box-shadow: inset 3px 3px 8px rgba(0,0,0,0.3), inset -1px -1px 3px rgba(255,255,255,0.2);
            border: 2px solid #6b7264; display: flex; justify-content: center; align-items: center;
        }
        
        .time-display {
            font-family: 'Share Tech Mono', monospace; font-size: 3.6rem; 
            color: #1a1c18; text-shadow: 1px 1px 0px rgba(0,0,0,0.1); letter-spacing: 2px;
        }

        /* Fiziksel Tuşlar */
        .hardware-controls { display: flex; justify-content: space-around; gap: 12px; padding: 0 5px; }
        .hw-btn {
            color: #fff; border: none; padding: 16px 10px; 
            border-radius: 25px; font-weight: 700; font-size: 0.85rem; letter-spacing: 1px;
            cursor: pointer; transition: all 0.1s; display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .hw-btn .icon { font-size: 1.3rem; line-height: 1; }

        /* Ana buton: BAŞLAT/DURDUR - daha büyük, durum renkli */
        .btn-main {
            flex: 2;
            box-shadow: 0 5px 0 #000, 0 8px 12px rgba(0,0,0,0.4);
        }
        .btn-main:active { transform: translateY(5px); box-shadow: 0 0 0 #000, 0 2px 5px rgba(0,0,0,0.4); }
        .btn-start { background: #16a34a; box-shadow: 0 5px 0 #14532d, 0 8px 12px rgba(22,163,74,0.4); }
        .btn-start:active { box-shadow: 0 0 0 #14532d, 0 2px 5px rgba(22,163,74,0.4); }
        .btn-stop { background: #dc2626; box-shadow: 0 5px 0 #7f1d1d, 0 8px 12px rgba(220,38,38,0.4); }
        .btn-stop:active { box-shadow: 0 0 0 #7f1d1d, 0 2px 5px rgba(220,38,38,0.4); }

        /* İkincil buton: SIFIRLA - daha küçük, nötr */
        .btn-secondary {
            flex: 1;
            background: #2a2a2a; color: #9ca3af;
            box-shadow: 0 5px 0 #000, 0 8px 10px rgba(0,0,0,0.4);
        }
        .btn-secondary:active { transform: translateY(5px); box-shadow: 0 0 0 #000, 0 2px 5px rgba(0,0,0,0.4); }
        
        .indicator { width: 6px; height: 6px; border-radius: 50%; background: #333; box-shadow: inset 0 1px 2px rgba(0,0,0,0.5); }
        .is-running .indicator { background: #ff4757; box-shadow: 0 0 6px #ff4757; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); justify-content: center; align-items: center; padding: 20px; z-index: 100;
        }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 350px; }
        .modal-title { font-size: 1.2rem; margin-bottom: 15px; color: #f8fafc; font-weight: 600; }
        .modal-input {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #475569;
            background: #0f1115; color: white; margin-bottom: 20px; font-size: 1rem;
        }
        .modal-actions { display: flex; gap: 10px; }
        .btn-modal { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; color: white; }
        .btn-modal-create { background: #2563eb; }
        .btn-modal-cancel { background: #475569; }
    </style>
</head>
<body>

    <header>
        <h1>⏱️ Kronometre</h1>
        <button class="add-btn" onclick="openModal()">+ Yeni Kronometre Ekle</button>
    </header>

    <div class="tabs" id="tabsContainer"></div>
    <div id="timersContainer"></div>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-title">Kronometre Adı</div>
            <input type="text" id="timerNameInput" class="modal-input" placeholder="Örn: Çay, Spor, Çarşı..." maxlength="25">
            <div class="modal-actions">
                <button class="btn-modal btn-modal-cancel" onclick="closeModal()">İptal</button>
                <button class="btn-modal btn-modal-create" onclick="createTimer()">Oluştur</button>
            </div>
        </div>
    </div>

    <script>
        let timers = JSON.parse(localStorage.getItem('my_stopwatches')) || [];
        let activeTab = 'all';

        function saveTimers() {
            localStorage.setItem('my_stopwatches', JSON.stringify(timers));
        }

        function formatTime(ms) {
            let totalMs = Math.floor(ms);
            let hours = Math.floor(totalMs / 3600000);
            let mins = Math.floor((totalMs % 3600000) / 60000);
            let secs = Math.floor((totalMs % 60000) / 1000);
            let centis = Math.floor((totalMs % 1000) / 10);

            if (hours > 0) {
                return `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            } else {
                return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}:${String(centis).padStart(2, '0')}`;
            }
        }

        function getCurrentElapsedTime(timer) {
            if (timer.isRunning) {
                return timer.elapsedTime + (Date.now() - timer.startTime);
            }
            return timer.elapsedTime;
        }

        function renderTabs() {
            const container = document.getElementById('tabsContainer');
            if (timers.length === 0) {
                container.innerHTML = '';
                return;
            }

            let html = `<div class="tab ${activeTab === 'all' ? 'active' : ''}" onclick="filterTab('all')">Tüm Liste</div>`;
            timers.forEach(t => {
                html += `<div class="tab ${activeTab === t.id ? 'active' : ''}" onclick="filterTab(${t.id})">${t.title}</div>`;
            });
            container.innerHTML = html;
        }

        function filterTab(tabId) {
            activeTab = tabId;
            renderTabs();
            renderTimers();
        }

        function renderTimers() {
            const container = document.getElementById('timersContainer');
            container.innerHTML = '';

            if (timers.length === 0) {
                container.innerHTML = `<div class="empty-state">Henüz eklenmiş bir görev yok.<br><br>Yukarıdaki butona tıklayarak ilk zamanlayıcını oluştur.</div>`;
                return;
            }

            const listToRender = activeTab === 'all' ? timers : timers.filter(t => t.id === activeTab);

            listToRender.forEach(timer => {
                const currentMs = getCurrentElapsedTime(timer);
                const isRunningClass = timer.isRunning ? 'is-running' : '';
                const mainBtnClass = timer.isRunning ? 'btn-stop' : 'btn-start';
                const mainBtnIcon = timer.isRunning ? '⏸' : '▶';
                const mainBtnText = timer.isRunning ? 'DURDUR' : 'BAŞLAT';
                
                const card = document.createElement('div');
                card.className = `timer-hardware ${isRunningClass}`;
                card.id = `hardware-${timer.id}`;
                
                card.innerHTML = `
                    <div class="timer-header">
                        <span class="timer-title">${timer.title}</span>
                        <button class="delete-btn" onclick="deleteTimer(${timer.id})">✕</button>
                    </div>
                    
                    <div class="lcd-screen">
                        <div class="time-display" id="display-${timer.id}">${formatTime(currentMs)}</div>
                    </div>
                    
                    <div class="hardware-controls">
                        <button class="hw-btn btn-main ${mainBtnClass}" onclick="toggleTimer(${timer.id})">
                            <span class="icon">${mainBtnIcon}</span>
                            ${mainBtnText}
                        </button>
                        <button class="hw-btn btn-secondary" onclick="resetTimer(${timer.id})">
                            <span class="icon">↺</span>
                            SIFIRLA
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleTimer(id) {
            const t = timers.find(x => x.id === id);
            if (t) {
                if (!t.isRunning) {
                    t.isRunning = true;
                    t.startTime = Date.now();
                } else {
                    t.elapsedTime += (Date.now() - t.startTime);
                    t.isRunning = false;
                    t.startTime = null;
                }
                saveTimers();
                renderTimers();
            }
        }

        function resetTimer(id) {
            const t = timers.find(x => x.id === id);
            if (t) {
                t.elapsedTime = 0;
                if (t.isRunning) t.startTime = Date.now();
                saveTimers();
                renderTimers();
            }
        }

        function deleteTimer(id) {
            if (confirm('Bu kronometreyi listeden kaldırmak istediğine emin misin?')) {
                timers = timers.filter(x => x.id !== id);
                if (activeTab === id) activeTab = 'all';
                saveTimers();
                renderTabs();
                renderTimers();
            }
        }

        function openModal() { document.getElementById('addModal').style.display = 'flex'; }
        
        function closeModal() { 
            document.getElementById('addModal').style.display = 'none';
            document.getElementById('timerNameInput').value = '';
        }

        function createTimer() {
            const input = document.getElementById('timerNameInput');
            const name = input.value.trim();
            if (name) {
                const newTimer = {
                    id: Date.now(),
                    title: name,
                    elapsedTime: 0,
                    startTime: null,
                    isRunning: false
                };
                timers.push(newTimer);
                saveTimers();
                renderTabs();
                renderTimers();
                closeModal();
            }
        }

        function updateLoop() {
            timers.forEach(t => {
                if (t.isRunning) {
                    const el = document.getElementById(`display-${t.id}`);
                    if (el) el.textContent = formatTime(getCurrentElapsedTime(t));
                }
            });
            requestAnimationFrame(updateLoop);
        }
        requestAnimationFrame(updateLoop);

        renderTabs();
        renderTimers();
    </script>
</body>
</html>
